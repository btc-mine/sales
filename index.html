<style>
:root{
  --primary:#0d7377;--primary-dark:#095456;--primary-light:#14b8a6;
  --bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;
  --border:#e2e8f0;--danger:#dc2626;--success:#16a34a;
  --warning:#ea580c;--info:#0284c7;--radius:12px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Tahoma,'Segoe UI',system-ui,sans-serif;background:var(--bg);
  color:var(--text);direction:rtl;line-height:1.6;min-height:100vh;
  padding-bottom:80px;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:16px}
.unit{font-size:.8em;color:var(--muted);font-weight:normal}

.app{max-width:1300px;margin:0 auto;padding:12px}
.header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;padding:14px 18px;border-radius:var(--radius);display:flex;
  justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px}
.logo{font-size:32px;background:rgba(255,255,255,.15);width:50px;height:50px;
  border-radius:12px;display:flex;align-items:center;justify-content:center}
.brand h1{font-size:17px;font-weight:700}
.subtitle{font-size:12px;opacity:.85;margin-top:2px}
.cash-badge{background:rgba(255,255,255,.2);padding:8px 14px;border-radius:10px;
  text-align:center;font-size:11px}
.cash-badge .cash-val{font-size:16px;font-weight:800;display:block;
  font-variant-numeric:tabular-nums}
.cash-badge .cash-lbl{opacity:.9}

.nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0;background:var(--card);
  padding:6px;border-radius:var(--radius);box-shadow:var(--shadow)}
.nav button{background:transparent;color:var(--text);padding:9px 12px;
  border-radius:8px;font-size:13px;font-weight:600;transition:.15s;
  display:flex;align-items:center;gap:5px;white-space:nowrap}
.nav button:hover{background:#f1f5f9}
.nav button.active{background:var(--primary);color:#fff}

.content{display:flex;flex-direction:column;gap:12px}

.card{background:var(--card);border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow)}
.card h2{font-size:16px;margin-bottom:12px;color:var(--primary-dark);
  display:flex;align-items:center;gap:8px;padding-bottom:8px;
  border-bottom:1px solid var(--border)}
.card h3{font-size:14px;margin:10px 0 8px;color:var(--primary-dark)}

.btn{padding:10px 14px;border-radius:8px;font-size:14px;font-weight:600;
  transition:.15s;display:inline-flex;align-items:center;gap:6px;
  justify-content:center;min-height:42px}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-info{background:var(--info);color:#fff}
.btn-ghost{background:#f1f5f9;color:var(--text)}
.btn-ghost:hover{background:#e2e8f0}
.btn-lg{padding:16px 20px;font-size:16px;width:100%}
.btn-sm{padding:6px 10px;font-size:12px;min-height:32px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--border);
  border-radius:8px;background:#fff;transition:.15s;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(13,115,119,.1)}
.field input[readonly]{background:#f8fafc;color:var(--muted)}
.field-full{grid-column:1/-1}

.total-display{font-size:20px;font-weight:800;color:var(--primary-dark);
  background:#f0fdfa;padding:10px 14px;border-radius:8px;
  border:2px dashed var(--primary-light);text-align:center;
  font-variant-numeric:tabular-nums}

.radio-group{display:flex;gap:8px}
.radio-group label{flex:1;padding:10px;border:2px solid var(--border);
  border-radius:8px;cursor:pointer;text-align:center;font-weight:600;
  font-size:13px;transition:.15s;background:#fff}
.radio-group label.checked{border-color:var(--primary);background:#f0fdfa;
  color:var(--primary-dark)}
.radio-group input{display:none}

.summary-box{background:#f8fafc;border:1px solid var(--border);
  border-radius:8px;padding:12px;margin:12px 0;font-size:13px}
.summary-box .row{display:flex;justify-content:space-between;padding:3px 0}
.summary-box .row.total{border-top:1px solid var(--border);margin-top:5px;
  padding-top:7px;font-size:15px;font-weight:800;color:var(--primary-dark)}

.table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border);
  -webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px;background:#fff;
  min-width:560px}
th{background:#f8fafc;padding:9px 10px;text-align:right;font-weight:700;
  color:var(--muted);font-size:11px;border-bottom:1px solid var(--border);
  white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fafc}
.text-center{text-align:center}
.text-left{text-align:left}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.pos{color:var(--success)}
.neg{color:var(--danger)}
.empty-state{padding:30px 20px;text-align:center;color:var(--muted);
  font-size:13px}

.badge{display:inline-block;padding:3px 9px;border-radius:20px;
  font-size:10px;font-weight:700}
.badge-cash{background:#dcfce7;color:#166534}
.badge-credit{background:#fee2e2;color:#991b1b}
.badge-active{background:#dcfce7;color:#166534}
.badge-inactive{background:#f1f5f9;color:#64748b}
.badge-closed{background:#fef3c7;color:#92400e}
.badge-open{background:#dbeafe;color:#1e40af}
.badge-voided{background:#f1f5f9;color:#64748b;text-decoration:line-through}
.badge-warning{background:#ffedd5;color:#9a3412}
.badge-success{background:#dcfce7;color:#166534}
.badge-danger{background:#fee2e2;color:#991b1b}

.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:10px}
.stat{background:var(--card);border-radius:var(--radius);padding:14px;
  box-shadow:var(--shadow);border-right:4px solid var(--primary);
  display:flex;flex-direction:column;gap:4px}
.stat.blue{border-color:var(--info)}
.stat.green{border-color:var(--success)}
.stat.red{border-color:var(--danger)}
.stat.orange{border-color:var(--warning)}
.stat.cash{border-color:#059669;background:linear-gradient(135deg,#fff,#f0fdf4)}
.stat .label{font-size:11px;color:var(--muted);font-weight:600}
.stat .value{font-size:20px;font-weight:800;color:var(--text);
  font-variant-numeric:tabular-nums}
.stat .sub{font-size:10px;color:var(--muted)}

.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px}
.quick-btn{padding:16px 10px;border-radius:12px;background:#fff;
  box-shadow:var(--shadow);border:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  font-weight:700;color:var(--text);transition:.15s;font-size:12px}
.quick-btn:hover{border-color:var(--primary);transform:translateY(-2px)}
.quick-btn .ico{font-size:24px}
.quick-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}

.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);
  display:flex;align-items:center;justify-content:center;padding:12px;
  z-index:1000;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:var(--radius);width:100%;max-width:620px;
  max-height:92vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);
  animation:slideUp .2s}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}
  to{transform:translateY(0);opacity:1}}
.modal-header{padding:14px 16px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;background:#fff;z-index:1}
.modal-header h3{font-size:15px;color:var(--primary-dark)}
.close-btn{background:transparent;font-size:24px;color:var(--muted);
  width:30px;height:30px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;line-height:1}
.close-btn:hover{background:#f1f5f9}
.modal-body{padding:16px}
.modal-footer{padding:12px 16px;border-top:1px solid var(--border);
  display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;
  background:#fff}

.row-between{display:flex;justify-content:space-between;align-items:center;
  gap:10px;flex-wrap:wrap}
.flex{display:flex;gap:8px;flex-wrap:wrap}
.mt{margin-top:12px}
.mb{margin-bottom:12px}
.muted{color:var(--muted);font-size:12px}
.divider{height:1px;background:var(--border);margin:12px 0}
.warning-banner{background:#fef3c7;color:#92400e;padding:12px 16px;
  border-radius:8px;border-right:4px solid var(--warning);font-size:13px;
  font-weight:600}
.info-banner{background:#dbeafe;color:#1e40af;padding:12px 16px;
  border-radius:8px;border-right:4px solid var(--info);font-size:13px}
.success-banner{background:#dcfce7;color:#166534;padding:12px 16px;
  border-radius:8px;border-right:4px solid var(--success);font-size:13px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:#0f172a;color:#fff;padding:12px 22px;border-radius:10px;
  font-size:13px;font-weight:600;z-index:2000;
  box-shadow:0 10px 30px rgba(0,0,0,.3);animation:slideUp .2s;
  max-width:90vw;text-align:center}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}

.search-box{position:relative}
.search-box input{padding-right:34px}
.search-box::before{content:"🔍";position:absolute;right:10px;top:50%;
  transform:translateY(-50%);font-size:13px;opacity:.6}

#pwaInstallBtn{position:fixed;bottom:16px;left:16px;z-index:999;
  background:var(--primary);color:#fff;padding:11px 18px;
  border-radius:50px;font-size:13px;font-weight:700;display:none;
  align-items:center;gap:6px;box-shadow:0 6px 20px rgba(13,115,119,.4)}

@media (max-width:640px){
  .app{padding:8px}
  .header{padding:12px}
  .brand h1{font-size:15px}
  .logo{width:42px;height:42px;font-size:26px}
  .nav{padding:5px;overflow-x:auto;flex-wrap:nowrap}
  .nav button{padding:8px 10px;font-size:12px}
  .card{padding:12px}
  .stat .value{font-size:17px}
  .cash-badge .cash-val{font-size:14px}
  table{font-size:11px;min-width:520px}
  th,td{padding:7px 8px}
}
</style>

<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <div class="logo">⛽</div>
      <div>
        <h1>حسابداری تیل‌فروشی</h1>
        <div class="subtitle" id="todayDate"></div>
      </div>
    </div>
    <div class="cash-badge">
      <span class="cash-lbl">💰 صندوق (AFN)</span>
      <span class="cash-val" id="headerCash">0</span>
    </div>
  </header>
  <nav class="nav" id="nav"></nav>
  <main class="content" id="content"></main>
</div>
<div id="modalRoot"></div>
<button id="pwaInstallBtn" onclick="installPWA()">📲 نصب برنامه</button>

<script>
/* ==================================================================
   STATE / STORAGE
================================================================== */
const STORAGE_KEY = 'till_accounting_v2';

function defaultState() {
  return {
    customers: [
      { id:1, name:'مشتری عادی (Walk-in)', phone:'', address:'',
        notes:'مشتری نقدی – فروش نسیه ندارد', isWalkIn:true }
    ],
    products: [
      { id:1, name:'پترول', unit:'لیتر', price:65, active:true },
      { id:2, name:'دیزل', unit:'لیتر', price:70, active:true },
      { id:3, name:'تیل موتر', unit:'لیتر', price:250, active:true }
    ],
    sales: [],
    debtPayments: [],
    loans: [],
    loanPayments: [],
    cashAdjustments: [],   // manual cash in/out
    closedDays: {},
    logs: [],
    nextId: { customer:2, product:4, sale:1, debtPayment:1, loan:1,
              loanPayment:1, log:1, adj:1 }
  };
}

let state;
try {
  const raw = localStorage.getItem(STORAGE_KEY);
  state = raw ? JSON.parse(raw) : defaultState();
  if (!state.customers.some(c => c.isWalkIn))
    state.customers.unshift(defaultState().customers[0]);
  if (!state.cashAdjustments) state.cashAdjustments = [];
} catch (e) { state = defaultState(); }

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

/* ==================================================================
   HELPERS
================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
function fmt(n) {
  const v = Number(n) || 0;
  return new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 }).format(v);
}
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function nowTime() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function nowISO() { return new Date().toISOString(); }

function toJalali(gy, gm, gd) {
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365*gy) + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100)
           + Math.floor((gy2+399)/400) - 80 + gd + g_d_m[gm-1];
  jy += 33*Math.floor(days/12053);
  days %= 12053;
  jy += 4*Math.floor(days/1461);
  days %= 1461;
  if (days > 365) { jy += Math.floor((days-1)/365); days = (days-1)%365; }
  const jm = (days < 186) ? 1 + Math.floor(days/31) : 7 + Math.floor((days-186)/30);
  const jd = 1 + ((days < 186) ? (days%31) : ((days-186)%30));
  return [jy, jm, jd];
}
const JM = ['حمل','ثور','جوزا','سرطان','اسد','سنبله',
            'میزان','عقرب','قوس','جدی','دلو','حوت'];
function formatDate(iso) {
  if (!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  const [jy,jm,jd] = toJalali(y,m,d);
  return `${jd} ${JM[jm-1]} ${jy}`;
}
function formatDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const date = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const time = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  return `${formatDate(date)} – ${time}`;
}

function toast(msg, type='') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}
function log(action, details) {
  state.logs.push({ id:state.nextId.log++, timestamp:nowISO(), action, details });
  save();
}
function isDayClosed(date) { return !!state.closedDays[date]; }

/* ==================================================================
   CASH FLOW  ★★★  (CORE NEW FEATURE)  ★★★
   Every cash movement increases/decreases صندوق
================================================================== */

// Cash inflow from sales (CASH sales only — credit sales don't affect cash)
function cashFromSales(from, to) {
  return state.sales
    .filter(s => s.status !== 'voided' && s.paymentType === 'cash')
    .filter(s => (!from || s.date >= from) && (!to || s.date <= to))
    .reduce((a,s) => a + s.total, 0);
}

// Cash received from customers paying off their credit (this is a CASH INFLOW)
function cashFromDebtPayments(from, to) {
  return state.debtPayments
    .filter(p => p.status !== 'voided')
    .filter(p => (!from || p.date >= from) && (!to || p.date <= to))
    .reduce((a,p) => a + p.amount, 0);
}

// Cash received from personal loan returns (this is a CASH INFLOW)
function cashFromLoanReturns(from, to) {
  return state.loanPayments
    .filter(p => p.status !== 'voided')
    .filter(p => (!from || p.date >= from) && (!to || p.date <= to))
    .reduce((a,p) => a + p.amount, 0);
}

// Cash OUT: personal loans given away (money leaves the till)
function cashOutLoans(from, to) {
  return state.loans
    .filter(l => l.status !== 'voided')
    .filter(l => (!from || l.date >= from) && (!to || l.date <= to))
    .reduce((a,l) => a + l.amount, 0);
}

// Manual cash adjustments (opening balance, expenses, etc.)
function cashFromAdjustments(from, to) {
  return state.cashAdjustments
    .filter(a => a.status !== 'voided')
    .filter(a => (!from || a.date >= from) && (!to || a.date <= to))
    .reduce((a,x) => a + (x.type === 'in' ? x.amount : -x.amount), 0);
}

// Full cash summary for a period
function cashSummary(from, to) {
  const cashSales   = cashFromSales(from, to);
  const debtPaid    = cashFromDebtPayments(from, to);
  const loanReturn  = cashFromLoanReturns(from, to);
  const loansOut    = cashOutLoans(from, to);
  const adjustments = cashFromAdjustments(from, to);
  const totalIn  = cashSales + debtPaid + loanReturn + Math.max(adjustments, 0);
  const totalOut = loansOut + Math.max(-adjustments, 0);
  return {
    cashSales, debtPaid, loanReturn, loansOut, adjustments,
    totalIn, totalOut, net: totalIn - totalOut
  };
}

// Total cash on hand (all time)
function totalCashOnHand() {
  return cashSummary(null, null).net;
}

/* ==================================================================
   CUSTOMER & LOAN CALCULATIONS
================================================================== */
function customerBalance(cid) {
  const credit = state.sales
    .filter(s => s.customerId === cid && s.paymentType === 'credit'
              && s.status !== 'voided')
    .reduce((a,s) => a + s.total, 0);
  const paid = state.debtPayments
    .filter(p => p.customerId === cid && p.status !== 'voided')
    .reduce((a,p) => a + p.amount, 0);
  const init = state.customers.find(c => c.id === cid)?.initialBalance || 0;
  return credit + init - paid;
}
function customerTotalPurchases(cid) {
  return state.sales
    .filter(s => s.customerId === cid && s.status !== 'voided')
    .reduce((a,s) => a + s.total, 0);
}
function loanPaid(lid) {
  return state.loanPayments
    .filter(p => p.loanId === lid && p.status !== 'voided')
    .reduce((a,p) => a + p.amount, 0);
}
function loanRemaining(lid) {
  const l = state.loans.find(x => x.id === lid);
  if (!l) return 0;
  return l.amount - loanPaid(lid);
}
function loanStatus(lid) {
  const l = state.loans.find(x => x.id === lid);
  if (!l) return 'unknown';
  if (l.status === 'voided') return 'voided';
  const paid = loanPaid(lid);
  if (paid <= 0) return 'unpaid';
  if (paid >= l.amount) return 'paid';
  return 'partial';
}

/* ==================================================================
   DAY SUMMARY
================================================================== */
function daySummary(date) {
  const sales = state.sales.filter(s => s.date === date && s.status !== 'voided');
  const debtPayments = state.debtPayments.filter(p => p.date === date && p.status !== 'voided');
  const loansGiven = state.loans.filter(l => l.date === date && l.status !== 'voided');
  const loanPaymentsList = state.loanPayments.filter(p => p.date === date && p.status !== 'voided');

  const totalLiters = sales.reduce((a,s) => a + s.liters, 0);
  const totalSales = sales.reduce((a,s) => a + s.total, 0);
  const cashSales = sales.filter(s => s.paymentType === 'cash')
                         .reduce((a,s) => a + s.total, 0);
  const creditSales = sales.filter(s => s.paymentType === 'credit')
                           .reduce((a,s) => a + s.total, 0);
  const debtCollected = debtPayments.reduce((a,p) => a + p.amount, 0);
  const loansGivenTotal = loansGiven.reduce((a,l) => a + l.amount, 0);
  const loansReturnedTotal = loanPaymentsList.reduce((a,p) => a + p.amount, 0);

  // Cash movement of the day
  const cashIn = cashSales + debtCollected + loansReturnedTotal;
  const cashOut = loansGivenTotal;
  const netCash = cashIn - cashOut;

  const byProduct = {};
  for (const s of sales) {
    if (!byProduct[s.productId]) byProduct[s.productId] = { liters:0, total:0 };
    byProduct[s.productId].liters += s.liters;
    byProduct[s.productId].total += s.total;
  }

  return {
    date, count: sales.length, totalLiters, totalSales, cashSales, creditSales,
    debtCollected, loansGivenTotal, loansReturnedTotal,
    cashIn, cashOut, netCash,
    byProduct, salesList: sales, debtPaymentsList: debtPayments,
    loansGivenList: loansGiven, loanPaymentsList
  };
}

function onCustomerChange() {
  const c = state.customers.find(x => x.id === Number($('#saleCustomer').value));
  const lbl = $('#creditLabel');
  const r = lbl.querySelector('input');
  if (c?.isWalkIn) {
    r.disabled = true; lbl.style.opacity = '.45';
    lbl.style.pointerEvents = 'none';
    if (r.checked) selectPayType('cash');
  } else {
    r.disabled = false; lbl.style.opacity = '1';
    lbl.style.pointerEvents = 'auto';
  }
  updateSaleSummary();
}

function onProductChange() {
  const sel = $('#saleProduct');
  $('#salePrice').value = Number(sel.options[sel.selectedIndex].dataset.price) || 0;
  updateSaleTotal();
}
function selectPayType(type) {
  document.querySelectorAll('#payTypeGroup label').forEach(l => l.classList.remove('checked'));
  const r = document.querySelector(`input[name="payType"][value="${type}"]`);
  if (r.disabled) return;
  r.checked = true; r.closest('label').classList.add('checked');
  updateSaleSummary();
}
function getPayType() {
  return document.querySelector('input[name="payType"]:checked')?.value || 'cash';
}
function updateSaleTotal() {
  const l = parseFloat($('#saleLiters').value) || 0;
  const p = parseFloat($('#salePrice').value) || 0;
  $('#saleTotal').innerHTML = `${fmt(l*p)} <span class="unit">AFN</span>`;
  updateSaleSummary();
}
function updateSaleSummary() {
  const box = $('#saleSummary'); if (!box) return;
  const cid = Number($('#saleCustomer').value);
  const pid = Number($('#saleProduct').value);
  const c = state.customers.find(x=>x.id===cid);
  const p = state.products.find(x=>x.id===pid);
  const l = parseFloat($('#saleLiters').value) || 0;
  const pr = parseFloat($('#salePrice').value) || 0;
  const total = l*pr;
  const pay = getPayType();
  if (!l) { box.innerHTML = '<div class="muted">خلاصه پس از وارد کردن مقدار نمایش داده می‌شود…</div>'; return; }
  box.innerHTML = `
    <div class="row"><span>مشتری:</span><b>${esc(c?c.name:'—')}</b></div>
    <div class="row"><span>محصول:</span><b>${esc(p?p.name:'—')}</b></div>
    <div class="row"><span>مقدار:</span><b>${fmt(l)} لیتر</b></div>
    <div class="row"><span>قیمت:</span><b>${fmt(pr)} AFN</b></div>
    <div class="row"><span>پرداخت:</span><b>${pay==='cash'?'💵 نقد (صندوق +)':'📝 نسیه (صندوق بدون تغییر)'}</b></div>
    <div class="row total"><span>مبلغ کل:</span><span>${fmt(total)} AFN</span></div>`;
}
function submitSale() {
  const today = todayISO();
  if (isDayClosed(today)) { toast('امروز بسته شده است.', 'error'); return; }
  const cid = Number($('#saleCustomer').value);
  const pid = Number($('#saleProduct').value);
  const l = parseFloat($('#saleLiters').value) || 0;
  const pr = parseFloat($('#salePrice').value) || 0;
  const pay = getPayType();
  if (!l || l <= 0) { toast('مقدار لیتر الزامی است.', 'error'); return; }
  if (!pr || pr <= 0) { toast('قیمت الزامی است.', 'error'); return; }
  const c = state.customers.find(x=>x.id===cid);
  if (c?.isWalkIn && pay === 'credit') { toast('Walk-in نسیه مجاز نیست.', 'error'); return; }

  const total = l*pr;
  const cashMsg = pay==='cash'
    ? `💰 صندوق بعد: ${fmt(totalCashOnHand()+total)} AFN`
    : `📝 به بدهی مشتری اضافه می‌شود`;
  if (!confirm(
    `مشتری: ${c?.name}\nمحصول: ${state.products.find(p=>p.id===pid)?.name}\n`+
    `مقدار: ${fmt(l)} × ${fmt(pr)} = ${fmt(total)} AFN\n`+
    `پرداخت: ${pay==='cash'?'نقد':'نسیه'}\n\n${cashMsg}\n\nتأیید؟`
  )) return;

  state.sales.push({
    id: state.nextId.sale++, date: today, time: nowTime(), createdAt: nowISO(),
    customerId: cid, productId: pid, liters: l, pricePerLiter: pr, total,
    paymentType: pay, status: 'active'
  });
  log('ثبت فروش', `#${state.nextId.sale-1} | ${c?.name} | ${l}L × ${pr} = ${total} | ${pay}`);
  save();
  $('#saleLiters').value = ''; $('#salePrice').value = '';
  $('#saleTotal').innerHTML = '0 <span class="unit">AFN</span>';
  $('#saleSummary').innerHTML = '';
  toast('✅ فروش ثبت شد.', 'success');
  render();
}
function voidSale(id) {
  const s = state.sales.find(x=>x.id===id); if (!s) return;
  if (isDayClosed(s.date)) { toast('روز بسته است.', 'error'); return; }
  const r = prompt('دلیل باطل کردن:'); if (r === null) return;
  s.status = 'voided'; s.voidedAt = nowISO(); s.voidReason = r || '—';
  log('باطل فروش', `#${id} | ${r}`);
  save(); toast('باطل شد.', 'success'); render();
}

        <th>تاریخ</th><th>محصول</th><th>لیتر</th><th>مبلغ</th>

        ${pays.map(p => `<tr><td>${formatDate(p.date)}</td>

function updateDebtPaymentInfo() {
  const box = $('#dpSummary');
  const cid = Number($('#dpCustomer').value);

  const c = state.customers.find(x=>x.id===cid);

  box.innerHTML = `
    <div class="row"><span>مشتری:</span><b>${esc(c.name)}</b></div>

      <b>+${fmt(amt)} AFN</b></div>`;

function submitDebtPayment() {
  const today = todayISO();
  if (isDayClosed(today)) { toast('روز بسته است.', 'error'); return; }
  const cid = Number($('#dpCustomer').value);
  const amt = parseFloat($('#dpAmount').value) || 0;
  if (!cid || amt <= 0) { toast('اطلاعات کامل نیست.', 'error'); return; }
  const c = state.customers.find(x=>x.id===cid);
  if (!confirm(`دریافت ${fmt(amt)} AFN از ${c.name}؟\n\n💰 صندوق: +${fmt(amt)} AFN\nبدهی مشتری: ${fmt(customerBalance(cid))} → ${fmt(customerBalance(cid)-amt)}`)) return;
  state.debtPayments.push({
    id: state.nextId.debtPayment++, date: today, time: nowTime(),
    createdAt: nowISO(), customerId: cid, amount: amt,
    notes: $('#dpNotes').value.trim(), status: 'active'
  });
  log('دریافت پول نسیه', `#${state.nextId.debtPayment-1} | ${c.name} | ${amt} AFN`);
  save(); toast('✅ دریافت ثبت شد — صندوق افزایش یافت.', 'success'); render();
}

================================================================== */
let cashFilter = { from: todayISO(), to: todayISO() };

function renderCash() {
  const f = cashFilter;
  const cs = cashSummary(f.from || null, f.to || null);

  // Detailed list of all cash movements in the period
  const movements = [];
  state.sales.filter(s => s.status!=='voided' && s.paymentType==='cash')
    .filter(s => (!f.from||s.date>=f.from) && (!f.to||s.date<=f.to))
    .forEach(s => {

function submitAdjustment() {
  const type = $('#adjType').value;
  const amt = parseFloat($('#adjAmount').value) || 0;
  const notes = $('#adjNotes').value.trim();
  if (amt <= 0) { toast('مبلغ نامعتبر.', 'error'); return; }
  const id = state.nextId.adj++;
  state.cashAdjustments.push({
    id, date: todayISO(), time: nowTime(), type, amount: amt, notes,
    createdAt: nowISO(), status: 'active'
  });
  log('تنظیم صندوق', `#${id} | ${type==='in'?'+':'-'}${amt} | ${notes}`);
  save();
  toast(`✅ ${type==='in'?'افزایش':'کاهش'} صندوق ثبت شد.`, 'success');
  render();
}

/* ==================================================================
   CLOSE DAY
================================================================== */
function closeDay() {
  const today = todayISO();
  if (isDayClosed(today)) { toast('قبلاً بسته شده.', 'error'); return; }
  const s = daySummary(today);
  const cs = cashSummary(today, today);
  if (!confirm(
    `بستن روز ${formatDate(today)}؟\n\n`+
    `معاملات: ${s.count}\nلیتر: ${fmt(s.totalLiters)}\n`+
    `فروش: ${fmt(s.totalSales)} AFN\nنقد: ${fmt(s.cashSales)}\nنسیه: ${fmt(s.creditSales)}\n\n`+
    `💰 ورودی نقدی: ${fmt(cs.totalIn)}\n💸 خروجی نقدی: ${fmt(cs.totalOut)}\n`+
    `خالص: ${fmt(cs.net)} AFN\n\n`+
    `بعد از بستن، امکان ثبت معامله جدید برای این روز وجود ندارد.`
  )) return;
  state.closedDays[today] = { closedAt: nowISO() };
  log('بستن روز', `${today} | فروش: ${s.totalSales} | صندوق خالص: ${cs.net}`);
  save(); toast('🔒 روز بسته شد.', 'success'); navigate('daily-report');
}
function reopenDay(date) {
  if (!isDayClosed(date)) return;
  if (!confirm(`باز کردن روز ${formatDate(date)}؟ (در لاگ ثبت می‌شود)`)) return;
  delete state.closedDays[date];
  log('باز کردن روز', `${date}`);
  save(); toast('🔓 باز شد.', 'success'); render();
}

          <td class="num neg">${fmt(r.cc)}</td>
          <td class="num pos">${fmt(r.paid)}</td>
          <td class="num ${r.bal>0?'neg':'pos'}"><b>${fmt(r.bal)}</b></td>
        </tr>`).join('')}
      </tbody></table></div>` : '<div class="empty-state">داده نیست.</div>'}
    </div>

    <div class="card">
      <h2>🤝 قرض نقدی</h2>
      ${loans.length ? `<div class="table-wrap"><table><thead><tr>
        <th>نام</th><th>مبلغ</th><th>برگشت</th><th>باقی</th>
      </tr></thead><tbody>
        ${loans.map(l => {
          const paid = loanPaid(l.id);
          return `<tr><td><b>${esc(l.personName)}</b></td>
            <td class="num">${fmt(l.amount)}</td>
            <td class="num pos">${fmt(paid)}</td>
            <td class="num neg">${fmt(l.amount-paid)}</td></tr>`;
        }).join('')}
      </tbody></table></div>` : '<div class="empty-state">داده نیست.</div>'}
    </div>
  `;
}

/* ==================================================================
   LOGS
================================================================== */
function renderLogs() {
  const logs = [...state.logs].sort((a,b) =>
    (b.timestamp||'').localeCompare(a.timestamp||''));
  return `
    <div class="card">
      <div class="row-between">
        <h2>📋 لاگ (${fmt(logs.length)})</h2>
        <div class="flex">
          <button class="btn btn-info btn-sm" onclick="exportData()">📥 پشتیبان‌گیری</button>
          <button class="btn btn-ghost btn-sm" onclick="importData()">📤 بازیابی</button>
          <button class="btn btn-ghost btn-sm" onclick="if(confirm('پاک کردن لاگ؟')){state.logs=[];save();render();}">🗑 لاگ</button>
        </div>
      </div>
      ${logs.length ? `<div class="table-wrap"><table><thead><tr>
        <th>#</th><th>زمان</th><th>عملیات</th><th>جزئیات</th>
      </tr></thead><tbody>
        ${logs.map(l => `<tr><td class="num">${l.id}</td>
          <td>${formatDateTime(l.timestamp)}</td>
          <td><span class="badge badge-open">${esc(l.action)}</span></td>
          <td>${esc(l.details)}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty-state">خالی.</div>'}
    </div>`;
}

/* ==================================================================
   BACKUP / RESTORE
================================================================== */
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `till-backup-${todayISO()}.json`;
  a.click();
  toast('📥 فایل پشتیبان ذخیره شد.', 'success');
}
function importData() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.customers || !data.sales) throw new Error('فرمت نامعتبر');
        if (!confirm('تمام اطلاعات فعلی جایگزین می‌شود. ادامه؟')) return;
        state = data;
        save(); toast('✅ بازیابی شد.', 'success'); render();
      } catch (err) { toast('خطا در فایل.', 'error'); }
    };
    reader.readAsText(file);
  };
  inp.click();
}

/* ==================================================================
   MODAL
================================================================== */
function showModal(title, body, footer) {
  $('#modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-header">
          <h3>${title}</h3>
          <button class="close-btn" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">${body}</div>
        <div class="modal-footer">${footer||''}</div>
      </div>
    </div>`;
}
function closeModal() { $('#modalRoot').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ==================================================================
   PWA INSTALL
================================================================== */
let deferredPrompt = null;
const installBtn = document.getElementById('pwaInstallBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferredPrompt = e;
  installBtn.style.display = 'flex';
});

window.installPWA = async function() {
  if (!deferredPrompt) {
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    alert(isIOS
      ? '📱 برای نصب روی iPhone:\n\n1. این صفحه را در Safari باز کنید\n2. دکمه Share (□↑) را بزنید\n3. Add to Home Screen را انتخاب کنید\n4. Add را بزنید'
      : '📱 برای نصب:\n\nمنوی مرورگر → Install app / Add to Home screen');
    return;
  }
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  console.log('Install:', outcome);
  deferredPrompt = null;
  installBtn.style.display = 'none';
};

window.addEventListener('appinstalled', () => {
  installBtn.style.display = 'none';
});

// Show button on iOS if not already installed
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                  || window.navigator.standalone === true;
if (isIOS && !isStandalone) {
  installBtn.style.display = 'flex';
}

/* ==================================================================
   BOOT
================================================================== */
render();
console.log('✅ App loaded — data stored offline in LocalStorage');
</script>
</body>
